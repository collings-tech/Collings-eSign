name: CI

on:
  pull_request:
    branches: [master, production]
  push:
    branches: [master, production]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # test/setup.js supplies the env vars config/env.js requires; Mongo is
      # mongodb-memory-server, so no secrets or services are needed.
      - run: npm test -- --ci

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint is advisory for now: master carries ~50 pre-existing ESLint errors
      # that are style/unused-var issues, not build breakers. Build is blocking.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
